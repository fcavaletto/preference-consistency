[project]
name = "preference-consistency"
version = "0.1.0"
description = "Local LLM-as-judge preference consistency eval (HH-RLHF slice)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ipykernel>=6.29"]

[project.scripts]
preference-consistency = "preference_consistency.run_eval:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
