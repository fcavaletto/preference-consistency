seed: 42
n_samples: 200
n_samples_max: 5000

data:
  # download: Anthropic HH-RLHF helpful-base (default; cached after first fetch)
  # fixture: bundled synthetic pairs (offline / CI)
  # cache: require an existing cache file only
  source: download
  fixture_path: data/fixtures/hh_tiny.jsonl
  cache_dir: data/cache
  hh_split: helpful-base
  hh_url: https://huggingface.co/datasets/Anthropic/hh-rlhf/resolve/main/helpful-base/train.jsonl.gz

model:
  backend: ollama
  name: qwen2.5:7b
  host: http://127.0.0.1:11434
  temperature: 0.0
  seed: 42
  timeout_s: 300
  num_predict: 64
  json_schema: true

prompts:
  system_path: configs/prompts/judge_system.txt
  user_path: configs/prompts/judge_user.txt
  verdict_pattern: "Verdict:\\s*([AB])"

conditions:
  baseline: true
  position_swap: true
  paraphrases:
    - whitespace
    - role_markup
    - lexical
  conflicting_instructions:
    short: configs/prompts/conflict_short.txt
    thorough: configs/prompts/conflict_thorough.txt
  # Lightweight Perez-style judge bias (not a full sycophancy suite)
  sycophancy:
    prefer_a: configs/prompts/sycophancy_prefer_a.txt
    prefer_b: configs/prompts/sycophancy_prefer_b.txt
    agree_user: configs/prompts/sycophancy_agree_user.txt
  # Same pressure, but in the user message (closer to Perez et al. than a system instruction)
  sycophancy_user:
    prefers_a: configs/prompts/sycophancy_user_prefers_a.txt
  # Append a no-new-facts restatement to one slot (simplified Zheng verbosity attack)
  verbosity:
    - bloat_a
    - bloat_b

output:
  judgments_name: judgments.jsonl
  results_name: results.md
  sample_name: sample_judgments.jsonl
